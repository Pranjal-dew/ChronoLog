<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Modern History Timeline — ChronoLog</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- TimelineJS3 CSS from Knight Lab CDN -->
  <link title="timeline-styles" rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">

  <!-- Custom Theme Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="timeline-page">

  <!-- Top Navigation Header -->
  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"></line><line x1="6" y1="18" x2="6" y2="11"></line><line x1="10" y1="18" x2="10" y2="11"></line><line x1="14" y1="18" x2="14" y2="11"></line><line x1="18" y1="18" x2="18" y2="11"></line><polygon points="12 2 20 7 4 7"></polygon></svg></span>
      <span class="brand-title">ChronoLog</span>
      <span class="brand-sub">Reading Notes</span>
    </a>

    <!-- Era Switcher Navigation -->
    <nav class="era-nav">
      <a href="ancient.html" class="era-link">Ancient</a>
      <a href="medieval.html" class="era-link">Medieval</a>
      <a href="modern.html" class="era-link active">Modern</a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <!-- Category Jump Filter -->
      <select id="category-filter" class="category-filter-select" title="Jump to topic or leader swimlane">
        <option value="all">All Topics</option>
      </select>

      <span id="event-count" class="event-count-pill">Loading...</span>

      <!-- Studio Editor Direct Link -->
      <a href="editor.html" class="btn-studio" title="Open ChronoLog Studio Editor">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span>Studio</span>
      </a>

      <!-- Fullscreen Mode Toggle -->
      <button id="btn-fullscreen" class="btn-fullscreen" title="Toggle Fullscreen Reading Mode (Press F)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <!-- Era Quick Jump Navigation Bar -->
  <nav class="era-subnav" id="era-subnav" aria-label="Era Quick Jump Navigation">
    <div class="era-subnav-inner" id="era-pills-container">
      <!-- Dynamic Era Jump Buttons will be injected here -->
    </div>
    <div class="keyboard-hints" title="Keyboard Shortcuts for Readers">
      <span class="kbd-hint"><kbd>←</kbd><kbd>→</kbd> Slide</span>
      <span class="kbd-hint"><kbd>1-3</kbd> Era</span>
      <span class="kbd-hint"><kbd>Home</kbd><kbd>End</kbd></span>
      <span class="kbd-hint"><kbd>F</kbd> Fullscreen</span>
    </div>
  </nav>

  <!-- TimelineJS Mount Area -->
  <main class="timeline-wrapper">
    <div id="timeline-embed"></div>
  </main>

  <!-- Archival Study Lightbox Modal -->
  <dialog id="study-lightbox" class="study-lightbox" aria-modal="true">
    <div class="lightbox-dialog-card">
      <button id="lightbox-close" class="lightbox-close-btn" title="Close Lightbox (Esc)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="lightbox-media-container">
        <img id="lightbox-img" src="" alt="Historical Artifact Inspection">
      </div>
      <div class="lightbox-info-bar">
        <h4 id="lightbox-headline" class="lightbox-headline"></h4>
        <p id="lightbox-caption" class="lightbox-caption"></p>
        <span id="lightbox-credit" class="lightbox-credit"></span>
      </div>
    </div>
  </dialog>

  <!-- TimelineJS CDN Script -->
  <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>

  <!-- Data and Init Scripts -->
  <script src="js/modern-data.js"></script>
  <script src="js/timeline-init.js"></script>
</body>
</html>
