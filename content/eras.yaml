  text:
    headline: Direct Crown Rule & Early Nationalism (1858–1918)
    text: <p>Queen Victoria's Proclamation of 1858, modern English education, Indian
      National Congress (1885), Partition of Bengal (1905), and Swadeshi Movement.</p>
- start_date:
