notes: Labour PM who convened the three Round Table Conferences in London (1930–1932)
  to negotiate Indian constitutional reforms. Issued the controversial Communal Award
  (August 1932) creating separate electorates for Depressed Classes, resolved through
  Gandhi and Ambedkar's Poona Pact.
