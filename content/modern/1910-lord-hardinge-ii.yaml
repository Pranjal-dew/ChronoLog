notes: Annulled the Partition of Bengal in the 1911 Delhi Durbar attended by King
  George V. Transferred the imperial capital from Calcutta to Delhi (1911). Survived
  a revolutionary bomb attack by Rash Behari Bose at Chandni Chowk (1912). Welcomed
  Mahatma Gandhi's return from South Africa (January 1915).
