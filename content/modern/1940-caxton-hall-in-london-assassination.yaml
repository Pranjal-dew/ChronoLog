notes: Revolutionary Sardar Udham Singh assassinated Michael O'Dwyer (the former Lieutenant Governor of Punjab who endorsed the Jallianwala Bagh massacre) at Caxton Hall in London. Udham Singh was subsequently tried and hanged at Pentonville Prison, becoming a prominent martyr of the revolutionary struggle.
