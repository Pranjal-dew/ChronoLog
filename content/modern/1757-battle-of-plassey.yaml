notes: British forces under Robert Clive defeated Siraj-ud-Daulah, the Nawab of Bengal,
  following the betrayal of commander Mir Jafar. This decisive battle laid the territorial
  foundation of the British East India Company's rule in India, transforming it from
  a trading company into a dominant sovereign authority.
