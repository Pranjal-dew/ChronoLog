notes: Devastating famine in the Bengal province of British India during World War II, leading to the death of an estimated 2 to 3 million people from starvation and epidemic diseases. Exacerbated by British wartime procurement, denial policies, and Churchill's refusal to divert shipping relief, it remains one of the greatest colonial humanitarian catastrophes.
