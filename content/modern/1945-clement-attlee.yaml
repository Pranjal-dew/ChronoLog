notes: Labour Prime Minister who granted Indian Independence. Dispatched the Cabinet
  Mission (1946). Made the historic announcement in the House of Commons on 20 February
  1947 stating Britain would quit India by June 1948. Appointed Lord Mountbatten and
  steered the Indian Independence Act 1947 through Parliament.
