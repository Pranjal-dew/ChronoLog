notes: Liberal PM. Enacted the Morley-Minto Reforms (Indian Councils Act 1909), introducing
  separate electorates for Muslims. Arranged King George V's Delhi Durbar of 1911
  that annulled the Partition of Bengal and transferred the capital to Delhi.
