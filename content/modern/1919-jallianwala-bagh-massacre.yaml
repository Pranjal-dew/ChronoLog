notes: British troops commanded by Brigadier-General Reginald Dyer opened fire on a peaceful crowd gathered at Jallianwala Bagh in Amritsar to celebrate Baisakhi and protest the arrest of leaders Dr. Saifuddin Kitchlew and Dr. Satyapal under the Rowlatt Act. Hundreds were killed and thousands injured, triggering widespread national outrage and Rabindranath Tagore renouncing his knighthood.
