notes: 'Last Viceroy of British India. Formulated the June 3rd Plan (Mountbatten Plan)
  partitioning the subcontinent into two dominions: India and Pakistan. Advanced the
  date of independence from June 1948 to August 15, 1947; oversaw Cyril Radcliffe''s
  boundary demarcation and the tragic partition migration.'
