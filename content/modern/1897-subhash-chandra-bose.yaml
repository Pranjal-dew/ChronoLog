notes: Charismatic nationalist leader and former Congress President (Haripura 1938, Tripuri 1939). After ideological differences with Gandhi regarding armed resistance, he escaped India in 1941, formed the Forward Bloc, and subsequently revitalized the Indian National Army (Azad Hind Fauj) with the slogan 'Give me blood, and I will give you freedom!'.
