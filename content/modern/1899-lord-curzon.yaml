notes: Ambitious and imperialist Viceroy. Partitioned the province of Bengal in 1905
  to weaken Indian nationalism, triggering the historic Swadeshi Movement. Passed
  the Indian Universities Act 1904, Ancient Monuments Preservation Act 1904, and set
  up the Department of Commerce and Industry.
