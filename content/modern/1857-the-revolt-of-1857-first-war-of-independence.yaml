notes: Triggered by sepoy resentment at Meerut over greased cartridges and underlying colonial grievances, the rebellion spread across Northern and Central India under the nominal leadership of Mughal Emperor Bahadur Shah Zafar. The revolt ended the reign of the East India Company and led directly to Queen Victoria's Proclamation of 1858 transferring power to the British Crown.
