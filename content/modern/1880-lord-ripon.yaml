notes: Beloved liberal Viceroy ('Father of Local Self-Government'). Repealed the Vernacular
  Press Act in 1882; passed the First Factory Act (1881) improving child labor conditions;
  appointed the Hunter Education Commission (1882); strongly backed the Ilbert Bill
  (1883) to allow Indian judges to try Europeans.
