notes: The British Parliament passed its first major statute to regulate the administration
  of the East India Company. Warren Hastings was appointed the first Governor-General
  of Bengal, subordinating Madras and Bombay presidencies, and establishing the Supreme
  Court of Judicature at Calcutta (1774).
