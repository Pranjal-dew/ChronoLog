end_date: null
display_date: 22 Oct 1764
group: Company Rule
notes: The combined forces of Mir Qasim (Nawab of Bengal), Shuja-ud-Daula (Nawab of
  Awadh), and Mughal Emperor Shah Alam II were decisively defeated by Hector Munro
  at Buxar. Through the subsequent Treaty of Allahabad (1765), Clive acquired the
  <em>Diwani</em> (fiscal administration and revenue collection rights) over Bengal,
  Bihar, and Orissa.
