notes: Mohandas Karamchand Gandhi was the preeminent leader of the Indian independence movement. Pioneer of Satyagraha (resistance through mass non-violent civil disobedience), he led transformative campaigns including the Champaran Satyagraha, Non-Cooperation Movement, Salt March, and Quit India Movement.
