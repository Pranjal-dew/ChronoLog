notes: Coalition Prime Minister during and after WWI. Passed the Montagu-Chelmsford
  Reforms (Government of India Act 1919) establishing provincial dyarchy. Faced intense
  Indian fury after the Rowlatt Act and General Dyer's Jallianwala Bagh massacre,
  triggering Gandhi's nationwide Non-Cooperation Movement.
