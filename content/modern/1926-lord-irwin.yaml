notes: Faced the boycott of the Simon Commission (1928), the Nehru Report (1928),
  and the Lahore Congress declaration of Purna Swaraj (1929). Gandhi launched the
  historic Salt March to Dandi (1930) and Civil Disobedience. Concluded the Gandhi-Irwin
  Pact on 5 March 1931, suspending the movement in exchange for releasing political
  prisoners.
