notes: Conservative British Prime Minister. Formulated imperialist foreign policy
  in Asia. Passed the Royal Titles Act 1876 proclaiming Queen Victoria Kaiser-i-Hind
  (Empress of India). Appointed Lord Lytton as Viceroy; presided over the devastating
  Great Famine of 1876–78 and Second Anglo-Afghan War.
