notes: Longest-serving Viceroy of India. Conducted 1937 provincial elections under
  the 1935 Act. Unilaterally committed India to World War II in 1939 without consulting
  Indian ministries. Formulated the August Offer (1940); crushed the Quit India Movement
  in August 1942 with military force; oversaw the disastrous 1943 Bengal Famine.
