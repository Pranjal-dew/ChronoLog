notes: Barrister, politician, and the founder of Pakistan. Initially an ambassador of Hindu-Muslim unity through the Congress and the Lucknow Pact (1916), Jinnah later led the All-India Muslim League, advocating for constitutional safeguards (14 Points). By 1940, he championed the Lahore Resolution based on the Two-Nation Theory, culminating in the partition of British India in 1947, where he served as Pakistan's first Governor-General.
