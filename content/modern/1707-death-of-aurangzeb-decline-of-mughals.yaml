notes: The death of Mughal Emperor Aurangzeb at Ahmednagar marked the end of the centralized
  imperial era. Succession wars and the rise of autonomous regional kingdoms (Marathas,
  Nawabs of Bengal, Awadh, and Nizam of Hyderabad) created a political vacuum swiftly
  exploited by European mercantilist powers.
