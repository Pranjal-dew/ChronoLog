notes: Wartime Coalition PM and staunch opponent of Indian self-rule. Declared he
  had not become Prime Minister to 'preside over the liquidation of the British Empire'.
  Dispatched the Cripps Mission (1942); imprisoned the entire Congress leadership
  after Quit India (1942). Presided over the man-made Bengal Famine of 1943 resulting
  in 3 million deaths.
