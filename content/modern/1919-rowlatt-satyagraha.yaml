notes: Nationwide hartal and satyagraha organized by Mahatma Gandhi against the Anarchical and Revolutionary Crimes Act of 1919 (Rowlatt Act), which authorized preventive detention and imprisonment without trial. It marked Gandhi's transition to all-India mass nationalist leadership.
