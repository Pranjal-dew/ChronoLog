notes: Formulated the Montagu-Chelmsford Reforms (Government of India Act 1919) instituting
  dyarchy. Enacted the repressive Anarchical and Revolutionary Crimes Act (Rowlatt
  Act) 1919; oversaw the Jallianwala Bagh massacre at Amritsar. Gandhi launched the
  Khilafat and Non-Cooperation Movement during his tenure.
