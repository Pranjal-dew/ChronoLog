notes: Viceroy during whose tenure the Indian National Congress was founded in Bombay
  (December 1885) under the initiative of A. O. Hume. Later ridiculed the Congress
  as representing only a 'microscopic minority'. Completed the Third Anglo-Burmese
  War (1885).
